    function baseSine(x) { return Math.sin(2 * Math.PI * 0.5 * x); }
    function baseTriangle(x) { const t = Math.abs(x); return t < 1 ? 1 - t : 0; }

    function getBase(type, x) {
      switch(type) {
        case 'gaussian': return baseGaussian(x);
        case 'square': return baseSquare(x);
        case 'sine': return baseSine(x);
        case 'triangle': return baseTriangle(x);
        default: return 0;
      }
    }
