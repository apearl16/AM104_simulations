<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fourier Transform Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #fafafa; margin: 20px; }
    svg { background: white; border: 1px solid #ccc; }
    .panel { display: inline-block; vertical-align: top; margin-right: 40px; }
    .controls { margin-top: 10px; }
    label { display: inline-block; width: 100px; }
  </style>
</head>
<body>
  <h2>Interactive Fourier Transform Demo</h2>
  <div class="controls">
    <label>Signal:</label>
    <select id="signalSelect">
      <option value="gaussian">Gaussian</option>
      <option value="square">Square</option>
      <option value="sine">Sine</option>
      <option value="triangle">Triangle</option>
    </select>
    <br><br>
    <label>Shift (x₀):</label>
    <input type="range" id="shiftSlider" min="-5" max="5" step="0.1" value="0">
    <br>
    <label>Scale (a):</label>
    <input type="range" id="scaleSlider" min="0.2" max="3" step="0.1" value="1">
    <br>
    <label>Modulation (k₀):</label>
    <input type="range" id="modSlider" min="-10" max="10" step="0.1" value="0">
  </div>

  <div>
    <div class="panel">
      <h3>Signal f(x)</h3>
      <svg id="signalPlot" width="400" height="200"></svg>
    </div>
    <div class="panel">
      <h3>Fourier Transform |F(k)|</h3>
      <svg id="fourierPlot" width="400" height="200"></svg>
    </div>
  </div>

  <script>
    const width = 400, height = 200;
    const x = d3.scaleLinear().domain([-10, 10]).range([0, width]);
    const y = d3.scaleLinear().domain([-1.5, 1.5]).range([height, 0]);
    const kx = d3.scaleLinear().domain([-10, 10]).range([0, width]);
    const ky = d3.scaleLinear().domain([0, 1.5]).range([height, 0]);

    const line = d3.line().x(d => x(d[0])).y(d => y(d[1]));
    const lineF = d3.line().x(d => kx(d[0])).y(d => ky(d[1]));

    const signalSVG = d3.select('#signalPlot');
    const fourierSVG = d3.select('#fourierPlot');

    function gaussian(x){ return Math.exp(-x*x/2); }
    function square(x){ return Math.abs(x) < 1 ? 1 : 0; }
    function sine(x){ return Math.sin(2*Math.PI*0.5*x); }
    function triangle(x){ let t = Math.abs(x); return t<1 ? 1-t : 0; }

    function getSignal(type, xvals){
      if(type==='gaussian') return xvals.map(v=>[v, gaussian(v)]);
      if(type==='square') return xvals.map(v=>[v, square(v)]);
      if(type==='sine') return xvals.map(v=>[v, sine(v)]);
      if(type==='triangle') return xvals.map(v=>[v, triangle(v)]);
    }

    function applyTransform(signal, shift, scale, mod){
      return signal.map(([xv,yv])=>{
        let newx = xv;
        let val = getBaseValue(signal, xv, shift, scale) * Math.cos(mod*xv);
        return [newx, val];
      });
    }

    function getBaseValue(signal, xv, shift, scale){
      let xadj = (xv - shift) * scale;
      const fn = currentSignalFunc;
      return fn(xadj);
    }

    // numeric FT
    function computeFT(signal){
      const xs = signal.map(d=>d[0]);
      const fs = signal.map(d=>d[1]);
      const ks = d3.range(-10,10.1,0.2);
      return ks.map(k=>{
        let re=0,im=0;
        for(let i=0;i<xs.length;i++){
          let x=xs[i], f=fs[i];
          re += f*Math.cos(-k*x);
          im += f*Math.sin(-k*x);
        }
        let mag = Math.sqrt(re*re+im*im)/xs.length;
        return [k, mag];
      });
    }

    let currentSignalFunc = gaussian;

    function update(){
      const type = d3.select('#signalSelect').property('value');
      const shift = +d3.select('#shiftSlider').property('value');
      const scale = +d3.select('#scaleSlider').property('value');
      const mod = +d3.select('#modSlider').property('value');

      if(type==='gaussian') currentSignalFunc=gaussian;
      else if(type==='square') currentSignalFunc=square;
      else if(type==='sine') currentSignalFunc=sine;
      else if(type==='triangle') currentSignalFunc=triangle;

      const xs = d3.range(-10,10.1,0.1);
      const signal = xs.map(xv=>{
        const base = currentSignalFunc(scale*(xv-shift));
        const modRe = Math.cos(mod*xv);
        return [xv, base*modRe];
      });

      const F = computeFT(signal);

      signalSVG.selectAll('*').remove();
      signalSVG.append('path').datum(signal).attr('d', line).attr('stroke','steelblue').attr('fill','none');

      fourierSVG.selectAll('*').remove();
      fourierSVG.append('path').datum(F).attr('d', lineF).attr('stroke','tomato').attr('fill','none');
    }

    d3.selectAll('select,input').on('input', update);
    update();
  </script>
</body>
</html>
