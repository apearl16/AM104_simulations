<script src="https://cdn.jsdelivr.net/npm/fft.js@4.0.4/dist/fft.min.js"></script>
<script>
const width = 400, height = 200;
const N = 512; // power of two for FFT
const xs = d3.range(-10, 10, 20 / N);

const x = d3.scaleLinear().domain([-10, 10]).range([0, width]);
const y = d3.scaleLinear().domain([-1.5, 1.5]).range([height, 0]);
const kx = d3.scaleLinear().domain([-N/20, N/20]).range([0, width]);
const kyMag = d3.scaleLinear().domain([0, 1.5]).range([height, 0]);
const kyPhase = d3.scaleLinear().domain([-Math.PI, Math.PI]).range([height, 0]);

const line = d3.line().x(d => x(d[0])).y(d => y(d[1]));
const lineF = d3.line().x(d => kx(d[0])).y(d => kyMag(d[1]));
const linePhase = d3.line().x(d => kx(d[0])).y(d => kyPhase(d[1]));

const signalSVG = d3.select('#signalPlot');
const fourierSVG = d3.select('#fourierPlot');
const phaseSVG = d3.select('#phasePlot');

function gaussian(x){ return Math.exp(-x*x/2); }
function square(x){ return Math.abs(x) < 1 ? 1 : 0; }
function sine(x){ return Math.sin(2*Math.PI*0.5*x); }
function triangle(x){ const t = Math.abs(x); return t<1 ? 1-t : 0; }

let currentSignalFunc = gaussian;

function computeFFT(signal) {
  const f = new FFT(N);
  const inputRe = new Float64Array(N);
  const inputIm = new Float64Array(N);
  for (let i = 0; i < N; i++) inputRe[i] = signal[i][1];
  const outRe = new Float64Array(N);
  const outIm = new Float64Array(N);
  f.transform(outRe, outIm, inputRe, inputIm);

  // shift zero frequency to center
  const half = N/2;
  const magPhase = [];
  for (let i = 0; i < N; i++) {
    const j = (i + half) % N;
    const mag = Math.sqrt(outRe[j]**2 + outIm[j]**2) / N;
    const phase = Math.atan2(outIm[j], outRe[j]);
    magPhase.push([(i-half)/10, mag, phase]);
  }
  return magPhase;
}

function update(){
  const type = d3.select('#signalSelect').property('value');
  const shift = +d3.select('#shiftSlider').property('value');
  const scale = +d3.select('#scaleSlider').property('value');
  const mod = +d3.select('#modSlider').property('value');

  d3.select('#shiftInput').property('value', shift);
  d3.select('#scaleInput').property('value', scale);
  d3.select('#modInput').property('value', mod);

  if(type==='gaussian') currentSignalFunc=gaussian;
  else if(type==='square') currentSignalFunc=square;
  else if(type==='sine') currentSignalFunc=sine;
  else if(type==='triangle') currentSignalFunc=triangle;

  const signal = xs.map(xv=>{
    const base = currentSignalFunc(scale*(xv-shift));
    return [xv, base * Math.cos(mod*xv)];
  });

  const F = computeFFT(signal);

  signalSVG.selectAll('*').remove();
  signalSVG.append('path')
    .datum(signal).attr('d', line)
    .attr('stroke','steelblue').attr('fill','none');

  fourierSVG.selectAll('*').remove();
  fourierSVG.append('path')
    .datum(F).attr('d', lineF)
    .attr('stroke','tomato').attr('fill','none');

  phaseSVG.selectAll('*').remove();
  phaseSVG.append('path')
    .datum(F).attr('d', linePhase)
    .attr('stroke','green').attr('fill','none');

  // Y-axis label for phase
  phaseSVG.append('text')
    .attr('x', 10)
    .attr('y', 15)
    .attr('fill', '#333')
    .attr('font-size', '12px')
    .text('Phase (radians)');

  MathJax.typesetPromise();
}

function setInputs(){
  d3.select('#shiftInput').on('input', function(){
    d3.select('#shiftSlider').property('value', this.value); update();
  });
  d3.select('#scaleInput').on('input', function(){
    d3.select('#scaleSlider').property('value', this.value); update();
  });
  d3.select('#modInput').on('input', function(){
    d3.select('#modSlider').property('value', this.value); update();
  });
}

function reset(){
  d3.select('#shiftSlider').property('value', 0);
  d3.select('#scaleSlider').property('value', 1);
  d3.select('#modSlider').property('value', 0);
  update();
}

d3.selectAll('select,input[type="range"]').on('input', update);
d3.select('#resetButton').on('click', reset);
setInputs();
update();
</script>
